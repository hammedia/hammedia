/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

<style>
  [role="button"][aria-label="건너뛰기"] { visibility: hidden !important; }
  .intro-home-skip { position: fixed; z-index: 9999; top: max(20px, env(safe-area-inset-top)); right: max(22px, env(safe-area-inset-right)); padding: 8px 14px; border: 1px solid rgba(245,243,238,.5); border-radius: 16px; background: rgba(5,7,10,.75); color: #f5f3ee; font: 600 13px Inter, sans-serif; text-decoration: none; }
  .intro-home-skip:focus-visible { outline: 3px solid #f5f3ee; outline-offset: 3px; }
</style>
</head>
<body>
<a class="intro-home-skip" href="/?intro_done=1">건너뛰기 →</a>
<script>
  (() => {
    const returnTo = new URLSearchParams(location.search).get('return_to');
    if (!returnTo || !returnTo.startsWith('/?')) return;
    const home = new URL(returnTo, location.origin);
    if (home.origin !== location.origin || home.pathname !== '/') return;
    home.searchParams.set('intro_done', '1');
    document.querySelector('.intro-home-skip').href = home.href;
    document.addEventListener('click', (event) => {
      const enter = event.target.closest('a#enter');
      if (enter) enter.href = home.href;
    }, true);
  })();
</script>

html,body{background:#f4f3ee;overflow:hidden;margin:0;height:100%}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:${ui}px;height:${Ai}px;transform-origin:0 0;color:${$i};
 font-family:'Inter','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:absolute;inset:0;width:${ui}px;height:${Ai}px;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#app.bare,#app.bare #gl{width:100vw!important;height:100vh!important;height:100dvh!important;transform:none!important}
.pn{position:absolute;background:rgba(251,250,247,.93);border:1px solid #dedbd2;border-radius:6px;padding:14px 16px;box-sizing:border-box}
.k{font:700 10.5px 'Inter','Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:.3px;color:#7b8288}
.mono{font-family:'JetBrains Mono',monospace}
.big{font:800 54px/1 'Inter',sans-serif;letter-spacing:-1.5px;color:${Fn};font-variant-numeric:tabular-nums}
.ttl{font:800 19px/1.2 'Inter','Pretendard','Apple SD Gothic Neo',sans-serif;letter-spacing:-.3px}
.sub{font-size:11.5px;color:#5d656c;line-height:1.45}
.bar{height:3px;width:34px;background:${Fn};margin-bottom:9px}
.row{display:grid;grid-template-columns:22px 78px 1fr 50px;align-items:center;gap:7px;height:25px;padding:0 6px;margin:0 -6px;border-radius:4px;cursor:pointer;font-size:12px}
.row:hover{background:#efede6}.row.on{background:${Fn};color:#fff}
.row.on .tr{background:rgba(255,255,255,.25)}.row.on .fl{background:#fff}.row.on .num,.row.on .hr{color:#fff}
.row.hot .nm::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:${_l};margin-left:6px;vertical-align:1px}
.hr{font:600 10px 'JetBrains Mono',monospace;color:#8b9299}
.tr{position:relative;height:6px;background:#e4e1d8;border-radius:3px;overflow:hidden}
.gh{position:absolute;left:0;top:0;bottom:0;background:#cfcbbf}.fl{position:absolute;left:0;top:0;bottom:0;background:${Fn}}
.num{font:600 11px 'JetBrains Mono',monospace;text-align:right;color:#3d454b;font-variant-numeric:tabular-nums}
.bt{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border:1px solid #cfcbbf;border-radius:4px;background:#fbfaf7;
 font:600 11.5px 'Inter','Pretendard','Apple SD Gothic Neo',sans-serif;color:${$i};cursor:pointer;user-select:none;white-space:nowrap}
.bt:hover{background:#efede6}.bt.on{background:${Fn};border-color:${Fn};color:#fff}
.bts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tk{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:11.5px;line-height:1.4;padding:5px 0;border-top:1px solid #e9e6de}
.tk:first-child{border-top:0}.tk b{font:600 10.5px 'JetBrains Mono',monospace;color:${Fn}}
.tk span{color:#3d454b;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tk em{font-style:normal;color:#8b9299;font-size:10.5px}
.tag{position:absolute;transform:translate(-50%,-130%);pointer-events:none;white-space:nowrap;font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;background:${Fn};color:#fff}
.who{position:absolute;transform:translate(-50%,-160%);pointer-events:none;white-space:nowrap;font-size:10.5px;font-weight:700;color:#a3103f;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px;margin-top:9px}
.kv b{font:700 13px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.note{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10.5px;color:#7b8288}
.bare .pn,.bare .note,.bare .tag,.bare .who,.bare .mob{display:none!important}
.mob{display:none}
.tall .pn,.tall .note{display:none}
.tall #p1{display:block;transform:scale(.74);transform-origin:0 0;left:10px!important;top:10px!important}
.tall .mob{display:flex;position:absolute;left:10px;right:10px;bottom:16px;gap:8px;flex-wrap:wrap;justify-content:center}
.tall .mob .bt{height:42px;padding:0 14px;font-size:14px}
.endc .eT{font-size:26px!important;letter-spacing:2px!important}
.endc .eS{margin-top:6px!important;font-size:14px!important}
.endc .eA{margin-top:4px!important;font-size:13px!important;line-height:1.4!important}
.endc .eB{margin-top:14px!important;gap:8px!important}
.endc .eB>*{height:40px!important;padding:0 14px!important}
.endc .eB>#enter{padding:0 20px!important}
.endc .eN{margin-top:10px!important;font-size:12px!important}
