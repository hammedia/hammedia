<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-label="원본에 없는 서비스를 빼고 행동 순서로 고친 안내문"><title>원본에 없는 서비스를 빼고 행동 순서로 고친 안내문</title><rect width="900" height="820" fill="#F9F7F3"/><text x="46" y="66" fill="#1C1814" font-size="38" font-weight="700" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">같은 재료, 달라진 안내문</text><text x="46" y="111" fill="#514A43" font-size="26" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">가상 매장으로 보는 편집 연습</text><rect x="40" y="145" width="820" height="220" rx="8" fill="#F1EAE1" stroke="none" stroke-width="2"/><text x="66" y="193" fill="#514A43" font-size="28" font-weight="700" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">첫 판에서 보태진 말</text><text x="66" y="244" fill="#1C1814" font-size="30" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">“편한 자리에서 기다리시면</text><text x="66" y="290" fill="#1C1814" font-size="30" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">직원이 직접 가져다드립니다.”</text><text x="66" y="338" fill="#8D493B" font-size="27" font-weight="700" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">원본에는 없던 서비스 → 삭제</text><rect x="40" y="395" width="820" height="370" rx="8" fill="#EAF1EC" stroke="none" stroke-width="2"/><text x="66" y="447" fill="#245C49" font-size="28" font-weight="700" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">원본에 맞게 고친 세 줄</text><text x="66" y="507" fill="#1C1814" font-size="34" font-weight="700" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">포장 음료, 이렇게 받아주세요</text><text x="66" y="573" fill="#1C1814" font-size="30" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">1  입구 카운터에서 주문·결제</text><text x="66" y="635" fill="#1C1814" font-size="30" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">2  오른쪽 벽 쪽에서 대기</text><text x="66" y="697" fill="#1C1814" font-size="30" font-weight="400" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">3  번호를 들으면 오른쪽 카운터에서 수령</text></svg>