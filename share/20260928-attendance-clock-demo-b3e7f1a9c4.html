<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>가게 출퇴근 기록기 — 체험판</title>
<meta name="description" content="앱 설치도 회원가입도 없이, 가게 폰 하나로 직원 출근·퇴근을 찍고 사장님이 월 정리를 봅니다. 체험판은 가명 직원만 들어 있습니다.">
<style>
  :root{--paper:#f4f1ea;--card:#fffdf8;--ink:#201b17;--muted:#665c55;--line:#ded7cd;--blue:#2367a5;--green:#167253;--green-soft:#e6f3ee;--red:#b54235;--radius:18px;--font:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
  .demo{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .clock{font-size:13px;color:var(--muted);text-align:right}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font:inherit;font-size:15px;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .emp{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
  .emp .n{font-size:18px;font-weight:700}
  .emp .r{font-size:12px;color:var(--muted)}
  .emp .s{font-size:13px;font-weight:600;color:var(--muted)}
  .emp .r{display:none}
  .emp.in{border-color:var(--green);background:var(--green-soft)}
  .emp.in .s{color:var(--green)}
  .emp:active{transform:translateY(1px)}
  .sheet{position:fixed;inset:0;background:rgba(32,27,23,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.on{display:flex}
  .panel{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 26px;width:100%;max-width:640px}
  .panel h2{margin:0 0 4px;font-size:22px}
  .panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .big{display:block;width:100%;border:0;border-radius:14px;padding:18px;font:inherit;font-size:20px;font-weight:800;cursor:pointer;margin-top:8px;color:#fff}
  .big.in{background:var(--green)} .big.out{background:var(--red)}
  .big.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500;font-size:15px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;display:none;z-index:20}
  .toast.on{display:block}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:12px;color:var(--muted)}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11px;color:var(--muted);font-weight:600}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;margin-left:6px}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  .month{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .month b{font-size:17px;flex:1;text-align:center}
  .log{font-size:13px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
  .log div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .log div:last-child{border:0}
  .warn{color:var(--red)}
  .flab{display:block;font-size:13px;color:var(--muted);margin:8px 0 12px}
  .finp{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .pick{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 14px;font-size:16px}
  .slip{font-size:14px}
  .slipHead{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px;font-size:16px}
  .slipHead span{font-size:12px;color:var(--muted)}
  .slipRow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .slipT{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
  .slipT th,.slipT td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  .slipT th:first-child,.slipT td:first-child{text-align:left;white-space:nowrap}
  .slipT .how{text-align:left;color:var(--muted);font-size:12px;white-space:normal}
  .slipT .sum td{font-weight:700;border-top:1px solid var(--ink)}
  .slipNet{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-top:12px;padding:12px;background:var(--green-soft);border-radius:12px}
  .setup{position:fixed;inset:0;z-index:30;background:var(--paper);display:none;overflow:auto;padding:20px 16px}
  .setup.on{display:block}
  .setup .panel{border-radius:18px;max-width:520px;margin:0 auto;padding:22px;border:1px solid var(--line)}
  .setup h2{font-size:22px;margin:0 0 6px}
  .setup .error{color:var(--red);min-height:22px;font-size:13px}
  .owner-summary{list-style:none;padding:0;margin:0}
  .owner-summary li{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .owner-summary strong{font-size:18px}
  .sec{font-size:16px;margin:0 0 6px} .sec small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
  .setrow{display:block;width:100%;margin-top:6px;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .wage{font-size:12px;padding:2px 8px}
  .today li{align-items:center} .today li>span:first-child{white-space:nowrap} .today .t{font-size:15px;text-align:right} .today .off{color:var(--muted);font-size:14px}
  .fixbox{border-color:var(--red)}
  .log div.just{background:var(--green-soft);border-radius:8px;padding-left:6px;padding-right:6px}
  .today .mark{display:block;font-size:11px;color:var(--muted)}
  .more{display:block;width:100%;margin-top:8px}
  .backup{border-color:var(--blue);background:#eef4fb} .backup p{margin:0 0 8px;font-size:15px}
  .rows .row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer}
  .rows .row>span:first-child{flex:1}
  .rows .row::after{content:'›';color:var(--muted);font-size:18px;margin-left:2px}
  .rows .row:last-child{border-bottom:0} .rows .row .v{text-align:right;white-space:nowrap} .rows .row .v small{display:block;font-size:11px;color:var(--muted)}
  .rows .row .off{color:var(--muted)} .rows .row.just{background:var(--green-soft)} .rows .row strong{font-size:18px}
  .mhead{display:flex;align-items:center;gap:6px} .mhead span{flex:1} .mnav{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;font:inherit;cursor:pointer}
  .setwrap details{margin:4px 2px} .setwrap summary{font-size:13px}
  .pinwait{border-color:#b7791f;background:#fdf6e7;font-size:15px} .pinwait p{margin:0 0 8px}
  .log div{flex-wrap:wrap} .log .mark{display:block;font-size:11px;color:var(--muted);text-align:right}
  .log .fixbtn{font-size:14px;padding:6px 10px}
  details{margin-top:16px} summary{cursor:pointer;font-size:14px;color:var(--muted);padding:8px 0}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  @media(max-width:360px){.wrap{padding:12px}.grid{gap:7px}.emp{padding:12px 9px}}
  @media print{body *{visibility:hidden}#slipSheet,#slipSheet *{visibility:visible}#slipSheet{position:static;background:none;display:block}.panel{box-shadow:none;max-width:none}#slipPrint,#slipClose{display:none}}
  footer{font-size:12px;color:var(--muted);line-height:1.7;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo">체험판 · 가명만 사용하세요. 기록은 이 기기에만 저장됩니다.</div>
  <header>
    <h1>가게 출퇴근 기록기 <small id="shopName"></small></h1>
    <div class="clock" id="clock"></div>
  </header>
  <div class="tabs">
    <button class="tab on" data-v="staff">직원 화면</button>
    <button class="tab" data-v="owner">사장 화면</button>
  </div>

  <section id="staff">
    <div class="card pinwait" id="pinNotice" hidden></div>
    <div class="card">
      <div class="grid" id="empGrid"></div>
    </div>
  </section>

  <section id="owner" style="display:none">
    <div class="card pinwait" id="pinOwner" hidden><p id="pinOwnerMsg"></p><button class="btn" id="pinOwnerBtn"></button></div>
    <div class="card">
      <h3 class="sec">오늘 <small id="todayCount"></small></h3>
      <div id="todayList" class="rows"></div>
    </div>
    <div class="card fixbox" id="fixBox" hidden>
      <h3 class="sec warn" id="missingCount"></h3>
      <div id="fixList" class="rows"></div>
    </div>
    <div class="card">
      <h3 class="sec mhead"><span id="monthLabel"></span><button class="mnav" id="prevM" aria-label="지난달">‹</button><button class="mnav" id="nextM" aria-label="다음 달">›</button></h3>
      <div id="monthList" class="rows"></div>
      <p id="backupMsg" class="note warn" hidden></p>
      <button class="big in" id="csv">이달 엑셀로 받기</button>
    </div>
    <div class="setwrap">
      <details><summary>가게·직원 설정</summary>
      <div class="tools"><button class="btn" id="seed">가명 시연 기록 채우기</button><button class="btn" id="wipe">이 기기 기록 지우기</button></div>
      <div class="tools"><button class="btn" id="breakSet">휴게 시간</button><button class="btn" id="setShop">가게 이름</button><button class="btn" id="addEmp">직원 추가</button><button class="btn" id="editEmp">이름 고치기</button><button class="btn" id="delEmp">직원 빼기</button><button class="btn" id="setPin">직원 PIN</button><button class="btn" id="ownerPin">사장 PIN 바꾸기</button></div>
      <p class="note geo">가게 밖에서 못 누르게 — <span id="geoStatus"></span></p>
      <div class="tools geo"><button class="btn" id="geoSet">여기를 가게로 등록</button><button class="btn" id="geoOff" style="display:none">위치 확인 끄기</button></div>
      </details>
    </div>
    <div class="card" hidden>
      <div hidden>
      <div class="tools">
        <button class="btn primary" id="payslip">직원 임금명세서</button>
        <button class="btn" id="paySet">급여 설정</button>
        <button class="btn" id="wageSet">직원 시급</button>
      </div>
      </div>
    </div>
  </section>

</div>

<div class="setup" id="setup"><div class="panel">
  <h2>처음 한 번만 정해 주세요</h2>
  <p class="note">가명 직원과 쉬는 요일, 휴게 시간을 정하면 출퇴근 화면이 열립니다. 사장 PIN은 네 자리로 잠급니다.</p>
  <span class="flab" style="margin-bottom:0">직원 이름</span>
  <div id="setupList"></div>
  <button class="btn more" id="setupAdd" type="button">+ 직원 더 넣기</button>
  <input type="hidden" id="setupNames">
  <label class="flab" style="display:none">쉬는 요일<select class="finp" id="setupRest"><option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option></select></label>
  <label class="flab">휴게 시간(분)<input class="finp" id="setupBreak" type="number" min="0" max="240" inputmode="numeric"></label>
  <label class="flab">사장 PIN 4자리<input class="finp" id="setupPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label>
  <p class="error" id="setupError" role="alert"></p>
  <button class="big in" id="setupDone">출퇴근 시작</button>
</div></div>

<div class="sheet" id="sheet"><div class="panel">
  <h2 id="pName"></h2><p class="sub" id="pSub"></p>
  <button class="big in" id="btnIn">출근</button>
  <button class="big out" id="btnOut">퇴근</button>
  <button class="big ghost" id="btnClose">닫기</button>
  <div class="note" id="pMsg" style="min-height:18px"></div>
</div></div>
<div class="sheet" id="personSheet"><div class="panel" style="max-height:92vh;overflow:auto">
  <h2 id="psName"></h2><p class="sub" id="psSub"></p>
  <div class="tools"><button class="btn" id="psWage"></button><button class="btn" id="psAdd">안 찍은 날 넣기</button></div>
  <div id="psList" class="rows" style="margin-top:12px"></div>
  <button class="big ghost" id="psClose">닫기</button>
</div></div>
<div class="sheet" id="formSheet"><div class="panel">
  <h2 id="formTitle"></h2><p class="sub" id="formSub"></p>
  <div id="formFields"></div>
  <button class="big in" id="formOk">저장</button>
  <button class="big ghost" id="formCancel">취소</button>
</div></div>
<div class="sheet" id="slipSheet"><div class="panel" style="max-height:92vh;overflow:auto">
  <div id="slipBody"></div>
  <button class="big in" id="slipPrint">인쇄 · PDF로 저장</button>
  <button class="big ghost" id="slipClose">닫기</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
/* 가게 출퇴근 기록기 — 체험판 v5 (HAM MEDIA 현장 도구, Case 011)
   원칙: 앱 설치·회원가입 없음 · 이 기기(브라우저)에만 저장 · 어디로도 전송 없음 · 체험판은 가명만.
   법정 최소 항목(임금대장, 근로기준법 시행령 27조): 성명 · 출근/퇴근 시각 · 휴게 · 연장/야간/휴일 · 합계 — 사장 화면과 CSV에 모두 나온다.
   v3부터 임금명세서(급여·공제) 계산 — 4대보험 근로자 부담 자동, 소득세는 간이세액표 근사(추정 표시). */
(function () {
  var KEY = 'ham_attendance_v1';
  var DEFAULT = {
    shop: '체험 가게',
    breakMin: 30,          // 4시간 넘게 일한 날 휴게 차감(분)
    restDay: 0,
    setupDone: false,
    nightFrom: 22, nightTo: 6, // 야간 구간
    emps: [
      { id: 'e1', n: '가명 하나', r: '주방 · 풀타임' }, { id: 'e2', n: '가명 둘', r: '주방 · 풀타임' },
      { id: 'e3', n: '가명 셋', r: '홀 매니저 · 정직원' }, { id: 'e4', n: '가명 넷', r: '홀 · 정직원' },
      { id: 'e5', n: '가명 다섯', r: '홀 · 아르바이트' }, { id: 'e6', n: '가명 여섯', r: '홀 · 아르바이트' }
    ],
    pay: { five: false, wage: 10320, payday: 10, rates: { np: 4.75, hi: 3.595, ltc: 0.4724, ei: 0.9 } }, // 근로자 부담 요율(%) 2026: 국민연금 4.75 · 건강 3.595 · 장기요양 0.4724(보수 기준) · 고용 0.9 // 5인 이상 여부(가산 수당 의무), 기본 시급(2026 최저시급 10,320원), 지급일
    lastExport: null,      // 마지막으로 엑셀로 받은 때(ms) — 백업 알림용
    geo: null,             // {lat, lng, radius} — 가게 좌표 하나만 기기 안에 저장. 직원 위치는 저장·전송하지 않는다
    recs: []               // {emp, in(ms), out(ms|null), edited:bool, orig:{in,out}(처음 찍힌 시각, 고쳐도 남음), added:bool(사장이 넣은 기록)}
  };
  var st = load();
  function load() { try { var s = localStorage.getItem(KEY); if (!s) return JSON.parse(JSON.stringify(DEFAULT)); var o = JSON.parse(s); Object.keys(DEFAULT).forEach(function (k) { if (o[k] === undefined) o[k] = DEFAULT[k]; }); return o; } catch (e) { return JSON.parse(JSON.stringify(DEFAULT)); } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { toast('저장 실패 — 브라우저 저장 공간을 확인하세요'); } }
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtT(d) { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtD(d) { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hm(h) { var m = Math.round(h * 60); if (m < 60) return m + '분'; return Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : ''); }
  function isToday(ms) { return fmtD(ms) === fmtD(Date.now()); }
  // 「지금 근무 중」 판정은 이 하나만 쓴다(직원 카드·오늘 칸·근무 중 수·빠진 퇴근이 같은 답)
  var SHIFT_MAX_H = 12; // 출근 뒤 12시간이 지나도 퇴근이 없으면 빠진 퇴근(마포바다 최장 12~23시 11시간. 김다온·외부손 10/7)
  function isCurrent(r) { if (!r || r.out) return false; var age = Date.now() - r.in; return age >= 0 && age < SHIFT_MAX_H * 36e5; }
  function isMissing(r) { return !r.out && !isCurrent(r); }
  function dayWord(ms) { if (isToday(ms)) return '오늘'; var y = new Date(); y.setDate(y.getDate() - 1); return fmtD(ms) === fmtD(y) ? '어제' : (new Date(ms).getMonth() + 1) + '월 ' + new Date(ms).getDate() + '일'; }
  function todayRecs(id) { return st.recs.filter(function (r) { return r.emp === id && (isToday(r.in) || isCurrent(r)); }); }
  function todayWork(id) { return todayRecs(id).reduce(function (a, r) { var c = calc(r); return a + (c ? c.work : 0); }, 0); }
  // 시각 고치기·넣기 — 처음 찍힌 시각은 orig에 한 번만 남기고 다시 덮지 않는다(분쟁 때 근거)

    var wage = e.wage || st.pay.wage, five = !!st.pay.five;
    var recs = st.recs.filter(function (r) { var d = new Date(r.in); return r.emp === e.id && r.out && d.getFullYear() === y && d.getMonth() === m; });
    var work = 0, over = 0, night = 0, hol = 0, wk = {};
    var wkOver = {};
    recs.forEach(function (r) { var c = calc(r); if (!c) return; work += c.work; over += c.over; night += c.night; hol += c.holHours; var k = weekKey(r.in); wk[k] = (wk[k] || 0) + c.work; wkOver[k] = (wkOver[k] || 0) + c.over; });
    // 주 40시간 초과분(하루 8시간 초과로 이미 센 것은 빼고) — 근로기준법 50·56조
    Object.keys(wk).forEach(function (k) { var extra = Math.max(0, wk[k] - 40 - (wkOver[k] || 0)); over += extra; });
    var weekly = 0; Object.keys(wk).forEach(function (k) { var h = wk[k]; if (h >= 15) weekly += Math.min(h / 40 * 8, 8); });
    var items = [
      ['기본 임금', work + 'h × ' + won(wage), work * wage],
      ['연장 가산(0.5배)', five ? over.toFixed(1) + 'h × ' + won(wage) + ' × 0.5' : '5인 미만 — 가산 없음', five ? over * wage * 0.5 : 0],
      ['야간 가산(0.5배)', five ? night.toFixed(1) + 'h × ' + won(wage) + ' × 0.5' : '5인 미만 — 가산 없음', five ? night * wage * 0.5 : 0],
      ['휴일 가산(0.5배)', five ? hol.toFixed(1) + 'h × ' + won(wage) + ' × 0.5' : '5인 미만 — 가산 없음', five ? hol * wage * 0.5 : 0],
      ['주휴수당', weekly.toFixed(1) + 'h × ' + won(wage) + ' (15h↑ 주 ' + Object.keys(wk).filter(function (k) { return wk[k] >= 15; }).length + '주 · 결근 주는 사장이 뺀다)', weekly * wage]
    ];
    var total = items.reduce(function (a, it) { return a + it[2]; }, 0);
    return { wage: wage, five: five, work: work, over: over, night: night, hol: hol, weekly: weekly, items: items, total: total, days: recs.length };
  }
  // ── 공제 자동 계산(v4) — 4대보험 근로자 부담분(요율은 설정에서 고침) · 월 60시간 미만은 국민연금·건강·장기요양 제외(고용보험만) · 소득세는 간이세액표 근사(확정은 홈택스)
  function ratesOf() { var r = (st.pay && st.pay.rates) || {}; return { np: +r.np || 4.75, hi: +r.hi || 3.595, ltc: +r.ltc || 0.4724, ei: +r.ei || 0.9 }; }
  var TAX_PTS = [[1060000, 0], [1500000, 7610], [2000000, 19520], [2500000, 36690], [3000000, 74350], [3500000, 122180], [4000000, 210960], [5000000, 350470], [6000000, 530000], [8000000, 950000], [10000000, 1400000]];
  function taxEst(pay) { if (pay <= TAX_PTS[0][0]) return 0; for (var i = 1; i < TAX_PTS.length; i++) { if (pay <= TAX_PTS[i][0]) { var a = TAX_PTS[i - 1], b = TAX_PTS[i]; return Math.round((a[1] + (b[1] - a[1]) * (pay - a[0]) / (b[0] - a[0])) / 10) * 10; } } var l = TAX_PTS[TAX_PTS.length - 1]; return Math.round(l[1] + (pay - l[0]) * 0.2); }
  function dedCalc(pc) {
    var r = ratesOf(), gross = pc.total, full = pc.work >= 60;
    var npBase = Math.min(Math.max(gross, 400000), 6370000); // 국민연금 기준소득월액 하한 40만·상한 637만(2025.7~2026.6 — 매년 7월 확인)
    var np = full ? npBase * r.np / 100 : 0, hi = full ? gross * r.hi / 100 : 0, ltc = full ? gross * r.ltc / 100 : 0, ei = gross * r.ei / 100;
    var tax = taxEst(gross), local = Math.round(tax * 0.1 / 10) * 10;
    return { full: full, items: [['국민연금 ' + r.np + '%', Math.round(np / 10) * 10, full ? (npBase !== gross ? '자동(상·하한 적용)' : '자동') : '월 60h 미만 제외'], ['건강보험 ' + r.hi + '%', Math.round(hi / 10) * 10, full ? '자동' : '월 60h 미만 제외'], ['장기요양 ' + r.ltc + '%', Math.round(ltc / 10) * 10, full ? '자동' : '월 60h 미만 제외'], ['고용보험 ' + r.ei + '%', Math.round(ei / 10) * 10, '자동'], ['소득세', tax, '간이세액표 추정(1인) — 홈택스로 확정'], ['지방소득세', local, '소득세의 10%']] };
  }

  function showPayslip(e, ded) {
    var pc = payCalc(e, ym.y, ym.m); var dsum = ded.reduce(function (a, d) { return a + d[1]; }, 0);
    var payDate = new Date(ym.y, ym.m + 1, st.pay.payday || 10);
    var h = '<div class="slip">' +
      '<div class="slipHead"><div><b>임금명세서</b><br><span>' + esc(st.shop) + '</span></div><div style="text-align:right">' + ym.y + '년 ' + (ym.m + 1) + '월분<br><span>지급일 ' + fmtD(payDate) + '</span></div></div>' +
      '<div class="slipRow"><span>성명</span><b>' + esc(e.n) + '</b></div><div class="slipRow"><span>역할 · 시급</span><b>' + esc(e.r || '-') + ' · ' + won(pc.wage) + (e.wage ? '' : ' (기본)') + '</b></div>' +
      '<div class="slipRow"><span>근무</span><b>' + pc.days + '일 · ' + pc.work.toFixed(1) + 'h' + (pc.five ? ' · 5인 이상' : ' · 5인 미만') + '</b></div>' +
      '<table class="slipT"><thead><tr><th>지급 항목</th><th>계산 방법</th><th>금액</th></tr></thead><tbody>';
    pc.items.forEach(function (it) { h += '<tr><td>' + it[0] + '</td><td class="how">' + it[1] + '</td><td>' + won(it[2]) + '</td></tr>'; });
    h += '<tr class="sum"><td>지급 총액</td><td></td><td>' + won(pc.total) + '</td></tr></tbody></table>' +
      '<table class="slipT"><thead><tr><th>공제 항목</th><th></th><th>금액</th></tr></thead><tbody>';
    ded.forEach(function (d) { h += '<tr><td>' + d[0] + '</td><td class="how">' + (d[2] || (d[1] ? '사장 입력' : '-')) + '</td><td>' + won(d[1]) + '</td></tr>'; });
    h += '<tr class="sum"><td>공제 합계</td><td></td><td>' + won(dsum) + '</td></tr></tbody></table>' +
      '<div class="slipNet"><span>실지급액</span><b>' + won(pc.total - dsum) + '</b></div>' +
      '<p class="note">주휴수당은 그 주에 결근이 없을 때만 지급합니다 — 결근한 주가 있으면 사장이 명세 보기 전에 그 주 시간을 확인합니다. 이 명세는 이 기기의 출퇴근 기록으로 계산한 것입니다. 4대보험은 근로자 부담 요율(설정에서 확인·수정)로 자동 계산했고, 소득세는 국세청 간이세액표(부양가족 1인) 근사값이라 홈택스 간이세액표로 확정합니다. 근로계약서의 소정근로시간·수당 약정이 다르면 그것이 우선합니다. 기준: 근로기준법 §48②·시행령 §27조의2(임금명세서 기재 사항).</p></div>';
    $('slipBody').innerHTML = h; $('slipSheet').classList.add('on');
  }
  $('payslip').addEventListener('click', function () {
    ask({ title: '명세를 볼 직원', sub: ym.y + '년 ' + (ym.m + 1) + '월분', list: st.emps.map(function (e) { return e.n + ' · ' + won(e.wage || st.pay.wage) + '/h'; }) }).then(function (v) { if (!v || v.pick === undefined) return; var e = st.emps[v.pick];
      var pc = payCalc(e, ym.y, ym.m), dc = dedCalc(pc);
      return ask({ title: '공제 — 자동 계산됨, 고칠 수 있음', sub: (dc.full ? '4대보험 근로자 부담분(2026 요율)' : '월 60시간 미만: 고용보험만') + ' · 소득세는 간이세액표 추정', fields: dc.items.map(function (d) { return { label: d[0] + ' — ' + d[2], type: 'number', value: d[1] }; }), ok: '명세 보기' })
        .then(function (w) { if (!w) return; showPayslip(e, dc.items.map(function (d, i) { return [d[0], +w[i] || 0, d[2]]; })); }); });
  });
  $('slipClose').addEventListener('click', function () { $('slipSheet').classList.remove('on'); });
  $('slipPrint').addEventListener('click', function () { window.print(); });
  $('paySet').addEventListener('click', function () {
    ask({ title: '급여 설정', sub: '5인 이상이면 연장·야간·휴일 가산(0.5배)이 붙습니다.', fields: [{ label: '기본 시급(원) — 2026 최저시급 10,320', type: 'number', value: st.pay.wage }, { label: '지급일(매달 며칠)', type: 'number', value: st.pay.payday }, { label: '5인 이상 사업장이면 1, 아니면 0', type: 'number', value: st.pay.five ? 1 : 0 }, { label: '국민연금 근로자 %(2026: 4.75)', type: 'number', value: ratesOf().np }, { label: '건강보험 근로자 %(2026: 3.595)', type: 'number', value: ratesOf().hi }, { label: '장기요양 근로자 %(2026: 0.4724)', type: 'number', value: ratesOf().ltc }, { label: '고용보험 근로자 %(2026: 0.9)', type: 'number', value: ratesOf().ei }] }).then(function (v) { if (!v) return; var w = parseInt(v[0], 10); if (w >= 1000) st.pay.wage = w; var d = parseInt(v[1], 10); if (d >= 1 && d <= 31) st.pay.payday = d; st.pay.five = v[2] === '1'; st.pay.rates = { np: +v[3] || 4.75, hi: +v[4] || 3.595, ltc: +v[5] || 0.4724, ei: +v[6] || 0.9 }; save(); toast('급여 설정 저장'); });
  });
  $('wageSet').addEventListener('click', function () {
    ask({ title: '시급 정할 직원', list: st.emps.map(function (e) { return e.n + ' · ' + won(e.wage || st.pay.wage) + (e.wage ? '' : '(기본)'); }) }).then(function (v) { if (!v || v.pick === undefined) return; var e = st.emps[v.pick]; return ask({ title: e.n + ' 시급', sub: '비우면 기본 시급', fields: [{ label: '시급(원)', type: 'number', value: e.wage || '' }] }).then(function (w) { if (!w) return; var n = parseInt(w[0], 10); e.wage = n >= 1000 ? n : undefined; save(); toast('시급 저장'); }); });
  });

  function startSetup() {
    if (st.setupDone && /^\d{4}$/.test(st.ownerPin || '')) return;
    var DEMO = KEY === 'ham_attendance_v1';
    document.querySelector('#setup .note').textContent = (DEMO ? '가명 직원 이름과 휴게 시간을 넣으면 바로 시작합니다.' : '직원 이름과 휴게 시간을 넣으면 바로 시작합니다.') + ' 사장 화면은 숫자 네 자리로 잠급니다.';
    $('setupList').innerHTML = ''; var names = st.emps.map(function (e) { return e.n; }); while (names.length < 3) names.push('');
    names.forEach(function (n) { addSetupRow(n); });
    $('setupRest').value = String(st.restDay || 0);
    $('setupBreak').value = String(st.breakMin == null ? 30 : st.breakMin);
    $('setup').classList.add('on');
  }
  // 직원 이름은 한 칸에 한 명. 빈 칸은 무시한다
  function addSetupRow(v) { var i = document.createElement('input'); i.className = 'setrow'; i.autocomplete = 'off'; i.value = v || ''; i.placeholder = KEY === 'ham_attendance_v1' ? '예: 가명 하나' : '예: 민수'; $('setupList').appendChild(i); return i; }
  $('setupAdd').addEventListener('click', function () { addSetupRow('').focus(); });
  $('setupDone').addEventListener('click', function () {
    var names = [].map.call(document.querySelectorAll('#setupList .setrow'), function (i) { return i.value.trim(); }).filter(Boolean);
    var unique = new Set(names.map(function (n) { return n.toLocaleLowerCase(); }));
    var brk = Number($('setupBreak').value), pin = $('setupPin').value.trim();
    if (!names.length || names.some(function (n) { return !n; }) || unique.size !== names.length) { $('setupError').textContent = names.length ? '같은 이름이 두 번 있습니다.' : '직원 이름을 한 명 이상 넣어 주세요.'; return; }
    if (st.recs.length && (names.length !== st.emps.length || names.some(function (n, i) { return n !== st.emps[i].n; }))) { $('setupError').textContent = '기존 기록의 직원 이름은 이 화면에서 바꾸지 않습니다. 설정 뒤 사장 화면의 이름 고치기를 사용해 주세요.'; return; }
    if (!Number.isInteger(brk) || brk < 0 || brk > 240) { $('setupError').textContent = '휴게 시간은 0~240분으로 적어 주세요.'; return; }
    if (!/^\d{4}$/.test(pin)) { $('setupError').textContent = '사장 PIN은 숫자 네 자리입니다.'; return; }
    if (!st.recs.length) st.emps = names.map(function (n, i) { return { id: 'e' + (i + 1), n: n, r: '' }; });
    st.breakMin = brk; st.ownerPin = pin; st.setupDone = true;
    save(); $('setup').classList.remove('on'); renderStaff(); toast('설정이 저장됐습니다');
  });
  // 늘 떠 있는 안내문은 체험판(가명 안내)에서만. 매장판의 백업 안내는 때가 되면 사장 화면 백업 칸이 대신한다
  if (KEY !== 'ham_attendance_v1') { var dm = document.querySelector('.demo'); if (dm) dm.hidden = true; document.querySelectorAll('.geo').forEach(function (x) { x.style.display = 'none'; }); }
  renderStaff(); renderPin();
  startSetup();
})();

</script>
