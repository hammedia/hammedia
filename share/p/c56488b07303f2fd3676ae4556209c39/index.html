<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta property="og:title" content="전달받은 문서"><meta property="og:description" content="비밀번호를 입력해 문서를 열어주세요."><title>전달받은 문서</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f6f4ed;color:#203930;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:32px 26px;background:#fffdf8;border:1px solid #d8ddd3;border-radius:16px}h1{font-size:30px;margin:0 0 16px;line-height:1.4}p,label,input,button{font-size:18px;line-height:1.7}p{color:#58685f;margin:0 0 24px}label{display:block;margin-bottom:8px;font-weight:700}input{width:100%;min-height:54px;padding:12px;border:1px solid #b8c4b6;border-radius:8px}button{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:8px;background:#254d3d;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.65}.status{font-size:17px;min-height:26px;margin:14px 0 0}a{color:inherit}input:focus-visible,button:focus-visible{outline:3px solid #b48852;outline-offset:3px}</style></head><body><main class="card"><h1>전달받은 문서를<br>열어보세요.</h1><p>보내드린 비밀번호를 입력하면<br>사진과 상세 내용을 볼 수 있습니다.</p><form id="unlock"><label for="password">문서 비밀번호</label><input id="password" type="password" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="전달받은 비밀번호"><button type="submit">문서 열기</button><p id="status" class="status" role="status" aria-live="polite"></p></form></main><script>
const config={"salt":"pkUZBEv6DcFNt2rD4/+JcQ==","iv":"nTkh3zshHFS06EVf","iterations":600000};const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let payload;
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),status=document.getElementById('status');button.disabled=true;try{if(!crypto.subtle)throw new Error('browser');status.textContent='문서를 여는 중입니다. 잠시만 기다려 주세요.';const password=document.getElementById('password').value.trim().toUpperCase();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);if(!payload){const response=await fetch('./document.bin',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error('network');payload=await response.arrayBuffer()}const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(config.iv)},key,payload);const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(error){status.textContent=error.message==='network'?'문서를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.':error.message==='browser'?'최신 브라우저에서 링크를 열어 주세요.':'비밀번호가 맞지 않습니다. 전달받은 비밀번호를 확인해 주세요.';button.disabled=false;document.getElementById('password').focus()}});
</script></body></html>
