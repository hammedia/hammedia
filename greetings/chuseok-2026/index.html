<!DOCTYPE html>

<head>

<meta property="og:type" content="website">

<meta property="og:description" content="함동민이 준비한 25초 추석 인사. 함께해 주셔서 고맙습니다. 넉넉한 한가위 보내세요.">

<meta property="og:image:width" content="1672">
<meta property="og:image:height" content="941">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="세 동료가 함께 준비한 함동민의 25초 추석 인사. 올해는, 인사가 움직입니다.">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="햄미디어 · 함동민의 인사">
<meta property="og:url" content="https://hammedia.co.kr/greetings/chuseok-2026/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="올해는, 인사가 움직입니다 — 함동민의 25초 추석 인사">
<meta name="twitter:description" content="함동민이 준비한 25초 추석 인사. 함께해 주셔서 고맙습니다. 넉넉한 한가위 보내세요.">
<meta name="twitter:image" content="https://hammedia.co.kr/greetings/chuseok-2026/card.jpg">
<meta name="theme-color" content="#f6efe2">
<style>
  :root {
    --ivory: #f6efe2;
    --ivory-deep: #efe4d0;
    --card: #fffaf1;
    --ink: #3f2c1d;
    --ink-soft: #6b5340;
    --line: #e3d4bc;
    --accent: #a8461f;
    --accent-deep: #8c3a19;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% 0%, #fbf5e9 0%, var(--ivory) 45%, var(--ivory-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, "Helvetica Neue",
      Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 14px 34px -16px rgba(63, 44, 29, 0.35),
      0 4px 12px -6px rgba(63, 44, 29, 0.18);
    overflow: hidden;
  }

  .top {
    padding: 24px 24px 0;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .headline {
    margin: 0;
    color: var(--ink);
    font-size: 26px;
    line-height: 1.34;
    font-weight: 800;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 600;
    word-break: keep-all;
  }

  /* 영상 슬롯 — 재생 전에는 원본 가로 카드 전체를 그대로 보여 준다(크롭 없음) */
  .player-slot {
    margin-top: 16px;
    background: var(--ivory-deep);
    overflow: hidden;
  }

  .photo-button {
    display: block;
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .photo-button img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
  }

  /* 눈에 보이는 안내는 단 한 줄 */
  .play-hint {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 0;
    background: rgba(63, 44, 29, 0.8);
    color: #fff7ee;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.6);
  }

  .play-hint .glyph {
    font-size: 10px;
    line-height: 1;
  }

  .player-slot.is-playing { background: #000; }

  .player {
    display: block;
    width: 100%;
    height: auto;
    min-height: 200px;
    min-width: 200px;
    aspect-ratio: 4 / 5;
    max-height: 70svh;
    border: 0;
    background: #000;
  }

  .bottom {
    padding: 20px 24px 24px;
    text-align: center;
  }

  .message {
    margin: 0;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }

  .signature {
    margin: 10px 0 0;
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
  }

  .fallback {
    margin: 12px 0 0;
    font-size: 13px;
  }

  .fallback a {
    color: var(--accent-deep);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .brand {
    margin: 18px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.6;
    word-break: keep-all;
  }

  .disclaimer {
    max-width: 460px;
    margin: 16px auto 0;
    color: #8a7360;
    font-size: 11.5px;
    line-height: 1.6;
    text-align: center;
    letter-spacing: 0;
  }

  .photo-button:focus-visible,
  a:focus-visible,
  .player:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }

  @media (hover: hover) and (pointer: fine) {
    .photo-button:hover img { opacity: 0.96; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 360px) {
    .top, .bottom { padding-left: 18px; padding-right: 18px; }
    .headline { font-size: 23px; }
    .message { font-size: 16px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <div class="top">
        <p class="eyebrow">2026 한가위</p>
        <h1 class="headline">함께해 주셔서 고맙습니다.</h1>
        <p class="subtitle">올해는 제 인사를 조금 움직여 봤습니다.</p>
      </div>

      <div class="player-slot" id="playerSlot">
        <button type="button" class="photo-button" id="playBtn"
                aria-label="눌러서 25초 인사 영상 보기">
          <img src="card.jpg"
               alt="추석 인사를 담은 카드 이미지 — 햄미디어 함동민"
               width="1672" height="941" decoding="async">
          <span class="play-hint"><span class="glyph" aria-hidden="true">▶</span>눌러서 25초 인사 보기</span>
        </button>
      </div>

      <div class="bottom">
        <p class="message">넉넉한 한가위 보내세요.</p>
        <p class="signature">함동민 드림</p>

        <p class="fallback" id="fallbackLink" hidden>
          <a href="https://youtube.com/shorts/6uJxFCODE30?feature=share">YouTube에서 보기</a>
        </p>

        <p class="brand">가게와 사람의 이야기를 영상으로 만듭니다.<br>햄미디어</p>
      </div>
    </article>

    <noscript>
      <p class="fallback" style="text-align:center">
        <a href="https://youtube.com/shorts/6uJxFCODE30?feature=share">YouTube에서 보기</a>
      </p>
    </noscript>

    <p class="disclaimer">인물과 장면은 AI로 연출했습니다.</p>
  </main>

  <script>
    (function () {
      var slot = document.getElementById('playerSlot');
      var btn = document.getElementById('playBtn');
      if (!slot || !btn) return;

      var VIDEO_ID = '6uJxFCODE30';

      function start() {
        if (slot.classList.contains('is-playing')) return;

        var iframe = document.createElement('iframe');
        iframe.className = 'player';
        iframe.title = '함동민의 25초 추석 인사 영상';
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.setAttribute('loading', 'eager');
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + VIDEO_ID +
          '?autoplay=1&playsinline=1&rel=0&hl=ko';

        slot.replaceChild(iframe, btn);
        slot.classList.add('is-playing');

        var fb = document.getElementById('fallbackLink');
        if (fb) fb.hidden = false;

        try { iframe.focus(); } catch (e) {}
      }

      btn.addEventListener('click', start);
    })();
  </script>
</body>
</html>
