<style>
  :root {
    --ivory: #f6efe2;
    --ivory-deep: #efe4d0;
    --card: #fffaf1;
    --ink: #3f2c1d;
    --ink-soft: #6b5340;
    --line: #e3d4bc;
    --accent: #a8461f;
    --accent-deep: #8c3a19;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% 0%, #fbf5e9 0%, var(--ivory) 45%, var(--ivory-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, "Helvetica Neue",
      Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 14px 34px -16px rgba(63, 44, 29, 0.35),
      0 4px 12px -6px rgba(63, 44, 29, 0.18);
    overflow: hidden;
  }

  /* 사진 카드 링크 — 원본 전체 노출, 크롭 없음 */
  .photo-link {
    display: block;
    min-height: 52px;
    background: var(--ivory-deep);
    border-radius: 22px 22px 0 0;
    overflow: hidden;
  }

  .photo-link img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
  }

  .body {
    padding: 26px 24px 24px;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .headline {
    margin: 0;
    color: var(--ink);
    font-size: 25px;
    line-height: 1.35;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 12px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 600;
  }

  .divider {
    width: 44px;
    height: 2px;
    margin: 20px auto;
    border: 0;
    background: var(--line);
    border-radius: 2px;
  }

  .message {
    margin: 0;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }

  /* 큰 CTA — 최소 높이 52px, 같은 탭 이동 */
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    margin: 24px 0 0;
    padding: 14px 22px;
    background: linear-gradient(180deg, #b54f24 0%, var(--accent-deep) 100%);
    color: #fff7ee;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-decoration: none;
    border-radius: 14px;
    box-shadow: 0 8px 18px -8px rgba(140, 58, 25, 0.65);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta .play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
  }

  .cta .ko {
    display: block;
  }

  .cta .sub {
    display: block;
    font-size: 12px;
    font-weight: 600;
    opacity: 0.85;
    letter-spacing: 0;
  }

  .brand {
    margin: 22px 0 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.6;
    word-break: keep-all;
  }

  .signature {
    margin: 14px 0 0;
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
  }

  .disclaimer {
    max-width: 460px;
    margin: 16px auto 0;
    color: #8a7360;
    font-size: 11.5px;
    line-height: 1.6;
    text-align: center;
    letter-spacing: 0;
  }

  a:focus-visible,
  .cta:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
    border-radius: 10px;
  }

  .photo-link:focus-visible {
    outline-offset: -3px;
    border-radius: 22px 22px 0 0;
  }

  @media (hover: hover) and (pointer: fine) {
    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px -8px rgba(140, 58, 25, 0.7);
    }
    .photo-link:hover img { opacity: 0.96; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .cta:hover { transform: none; }
  }

  @media (max-width: 360px) {
    .body { padding: 22px 18px 20px; }
    .headline { font-size: 22px; }
    .message { font-size: 16px; }
  }
</style>
</head>

          <span class="play" aria-hidden="true">▶</span>
          <span>
            <span class="ko">25초 인사 보기</span>

        <p class="signature">햄미디어 함동민 드림</p>
      </div>
    </article>

    <p class="disclaimer">인물과 장면은 AI로 연출했습니다.</p>
  </main>
