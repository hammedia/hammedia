name: Temporary Whisper Model Fetch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-whisper-model-fetch.yml

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify Whisper small q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin" \
            -o ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh ggml-small-q5_1.bin

      - name: Upload one-day artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1-model
          path: ggml-small-q5_1.bin
          retention-days: 1
          compression-level: 0

      - name: Publish temporary artifact locator
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > tmp-whisper-model-artifact-info-8f2d9.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "artifact_id": "${ARTIFACT_ID}",
            "artifact_url": "${ARTIFACT_URL}",
            "model": "ggml-small-q5_1.bin",
            "sha256": "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-whisper-model-artifact-info-8f2d9.json
          git commit -m "chore: publish temporary Whisper artifact locator" || true
          git push origin HEAD:main
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "TMP_WHISPER_RUN_${GITHUB_RUN_ID}" \
            --body "Artifact ID: ${ARTIFACT_ID}. Temporary public model retrieval locator."
