<!-- 팔레트: 05_HAM_DesignStudio/reference/clients/mapobada/DESIGN.md §4 (아이보리·갈색·금색)

  QR 페이로드는 python qrcode 라이브러리로 생성 후 pyzbar로 직접 디코드 검증함
  (대표님이 8/31 카톡으로 직접 보낸 네이버지도 링크 원문과 100% 일치) — 실제 스캔 가능 확인.
