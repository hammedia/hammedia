<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>마포바다 오픈일 방문</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F7F3EA; --paper:#FFFDF8; --ink:#2B2118; --ink2:#5E4E3F; --line:#DCCFB8;
  --gold:#A8802E; --gold-soft:#F1E6C8; --brown:#6B4A2B; --done:#3E6B3A; --done-soft:#E1EDDC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1612; --paper:#241E18; --ink:#F1E9DC; --ink2:#C9B9A4; --line:#4A3D30;
    --gold:#D4AA4E; --gold-soft:#3A2F1A; --brown:#C89A6A; --done:#9BCB8F; --done-soft:#26351F;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1612; --paper:#241E18; --ink:#F1E9DC; --ink2:#C9B9A4; --line:#4A3D30;
  --gold:#D4AA4E; --gold-soft:#3A2F1A; --brown:#C89A6A; --done:#9BCB8F; --done-soft:#26351F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:640px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
header{border-bottom:2px solid var(--gold);padding-bottom:12px}
h1{font-family:"Gowun Batang","Noto Serif KR",serif;font-weight:700;font-size:28px;margin:0 0 4px;text-wrap:balance;color:var(--brown)}
.sub{margin:0;color:var(--ink2);font-size:15px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 8px}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px}
h2{font-size:17px;margin:0 0 10px;color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
label.item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
label.item:has(input:checked){background:var(--done-soft);border-color:var(--done)}
label.item:has(input:checked) .t{color:var(--done);text-decoration:line-through}
label.item:focus-within{outline:2px solid var(--gold);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;margin:3px 0 0;accent-color:var(--done)}
.t{font-weight:500}
.d{display:block;color:var(--ink2);font-size:14px;margin-top:2px;font-weight:400}
.q{margin:8px 0 4px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0;font-family:"Gowun Batang",serif;font-size:16px;line-height:1.7}
.q span{display:block}
.spec{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;margin-right:4px;font-weight:700;letter-spacing:.03em}
a{color:var(--brown);font-weight:700}
.no{color:var(--ink2);font-size:15px;margin:0;padding-left:0;list-style:none}
.no li{padding:6px 0;border-top:1px dashed var(--line)}
.no li:first-child{border-top:0}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
footer{font-size:13px;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion:no-preference){label.item{transition:background .15s}}
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow">2026-09-02 · 오픈 당일 · 햄PD 직접 방문</p>
  <h1>마포바다 오픈일 방문</h1>
  <p class="sub">대표님께 걸려 있던 여덟 가지를 그 자리에서 받는다. 위에서부터 순서대로.</p>
</header>

<section>
  <h2>받아올 것</h2>
  <ul>
    <li><label class="item"><input type="checkbox" data-k="tv"><div><span class="t">매장TV 일부공개판, 보셨는지</span><span class="d">05번이 9/1 유튜브 링크로 보냄. 안 보셨으면 같이 1분만 틀어 보여드린다. 지금 11분 11초, 계약값 안.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="itv"><div><span class="t">대표님 인터뷰 촬영 — 세 마디</span><span class="d"><span class="spec">4K</span><span class="spec">가로</span><span class="spec">20~30초</span> 영상 맨 앞 인트로 자리. 매장은 무음이라 자막으로 다시 얹으니 발음·유창함 상관없음.</span>
      <div class="q"><span>저는 원래 책을 만들던 사람입니다.</span><span>그 사람이 지금은 밥을 짓고 있습니다.</span><span>왜 마포바다냐면요, 마포에 바다가 들어왔으면 했거든요.</span></div></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="k1"><div><span class="t">주방 컷 ① 회 뜨는 손</span><span class="d">도마 위 칼질, 손과 생선이 화면 가득. 얼굴 안 나와도 됨.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="k2"><div><span class="t">주방 컷 ② 활새우 소금구이 익는 장면</span><span class="d">소금 위에서 익는 새우. 지금은 냄비 사진뿐.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="k3"><div><span class="t">주방 컷 ③ 수조에서 뜰채로 건지는 손</span><span class="d">「살아 있는 채로」를 화면이 증명하는 컷.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="k4"><div><span class="t">주방 컷 ④ 놋그릇에 담아 상 차리는 손</span><span class="d">넷 다 <span class="spec">4K</span><span class="spec">가로</span><span class="spec">각 20~30초</span> 소리는 신경 안 써도 됨. 지금 11분 35초 안에 사람이 일하는 장면이 한 컷도 없다.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="page"><div><span class="t">매장정보 확인 페이지 8항목, 같이 체크</span><span class="d">12:37 카톡으로 보낸 그 페이지. 대표님 폰이나 햄PD 폰에서 열어 함께 누르면 오늘 끝난다. <a href="https://hammedia.co.kr/customers/mapobada/">hammedia.co.kr/customers/mapobada/</a></span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="set"><div><span class="t">세트 이름 — 「세트」인지 「한 상」인지</span><span class="d">세 곳(홈페이지·영상·인쇄물)에서 다르다. 하나로 정해 주시면 한 번에 통일.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="fish"><div><span class="t">모둠회 어종 목록</span><span class="d">9/1 통화에서 "고정 아니다, 카톡으로 주겠다" 하심. 오늘 쓰는 5~6종을 말로 받아 적어도 됨.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="blog"><div><span class="t">블로거 방문 날짜</span><span class="d">8/30에 "일·월 다 좋다" 하신 뒤 지남. 이번 주 어느 날인지 하나로.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="rcpt"><div><span class="t">리뷰용 영수증 2장</span><span class="d">8/31 요청. 그 자리에서 받으면 끝.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="ig"><div><span class="t">지메일에 인스타그램 코드 왔는지</span><span class="d">8/31 요청. 대표님 폰에서 지메일 한 번 열어보면 됨.</span></div></label></li>
  </ul>
</section>

<section>
  <h2>눈으로 볼 것</h2>
  <ul>
    <li><label class="item"><input type="checkbox" data-k="s1"><div><span class="t">대체 주차장이 어디인지 하나로</span><span class="d">네이버엔 「한라자동차공업사 염리점 130m」과 「공덕역 방향 100m 투썸 옆」 둘이 적혀 있다. 같은 곳인지 대표님께 한마디. 매장 실물 안내도 사진 한 장.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="s2"><div><span class="t">콜키지 · 반려동물 · 대관 표시물</span><span class="d">확인 페이지 항목의 실물 근거. 사진 한 장씩.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="s3"><div><span class="t">매장 TV 자리와 화면 비율</span><span class="d">USB 납품 전에 실제 화면 크기·가로세로·전원 위치. 사진 한 장.</span></div></label></li>
    <li><label class="item"><input type="checkbox" data-k="s4"><div><span class="t">리뷰 이벤트 조건 — 대표님 말로 받기</span><span class="d">확정된 건 「새우튀김 한 접시 4개」뿐. 어느 플랫폼(네이버/카카오/당근)인지, 영수증이 필요한지, 손님이 어떻게 보여주는지. 홍보 문안 ③이 이 답을 기다린다.</span></div></label></li>
  </ul>
</section>

<section>
  <h2>현장 메모</h2>
  <textarea id="memo" placeholder="어종, 날짜, 대표님 말 그대로. 돌아와서 카드에 옮긴다."></textarea>
</section>

<footer>체크와 메모는 이 폰에만 남는다. 돌아오시면 서비스마스터1이 카드에 옮긴다.</footer>
</main>
<script>
(function(){
  var K='mapobada-visit-0902';
  var st={};
  try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){st={}}
  var boxes=document.querySelectorAll('input[type=checkbox][data-k]');
  boxes.forEach(function(b){
    if(st[b.dataset.k])b.checked=true;
    b.addEventListener('change',function(){st[b.dataset.k]=b.checked;save()});
  });
  var memo=document.getElementById('memo');
  if(st.memo)memo.value=st.memo;
  memo.addEventListener('input',function(){st.memo=memo.value;save()});
  function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
})();
</script>
</body>
</html>
