    <h1>제4화. 창문 속의 아이</h1>
    <nav class="chapter-nav" aria-label="회차 이동"><a href="../">← 회차 목록</a><a rel="prev" href="../3화/index.html">← 이전 화</a></nav>

  <div class="comic">
    <section id="p1"><img src="01.png" alt="하윤이 시계에서 비는 주변 소리를 알아차린다. 태오는 도진과 수안의 주소를 적어 쪽지를 뒤문으로 보낸다. 비 오는 골목에 자전거 배달부가 도착한다." width="793" height="1983" loading="eager"><a class="page-link" href="01.png">그림 크게 보기 · 1/4</a></section>
    <section id="p2"><img src="02.png" alt="유건이 도진의 시계를 살핀다. 모래가 제때 값을 내지 않는다고 농담한다. 도진은 앞 창문 속 수안을 보고 다가간다." width="793" height="1984" loading="lazy"><a class="page-link" href="02.png">그림 크게 보기 · 2/4</a></section>
    <section id="p3"><img src="03.png" alt="하윤은 도진에게 시계 소리를 들어 보라고 한다. 시계에 남은 웃음소리와 창문 속 아이의 입 모양이 맞지 않는다. 태오가 책으로 창문을 가린다." width="793" height="1983" loading="lazy"><a class="page-link" href="03.png">그림 크게 보기 · 3/4</a></section>
    <section id="p4"><img src="04.png" alt="태오는 창문 속 존재의 이름을 부른다. 하윤과 도진은 창문이 보여 준 모습이 실제 수안이 아님을 알아차린다. 태오는 과거에 대해 말을 잇는다." width="793" height="1983" loading="lazy"><a class="page-link" href="04.png">그림 크게 보기 · 4/4</a></section>
