    <p class="intro">기억을 잃은 여자와 그녀를 기다린 남자.<br>열한 달 만에, 회항서점의 문이 열린다.</p>
    <p class="eyebrow">돌아온 사람들의 밤 · 웹툰</p>
    <h1>제5화. 일곱 장 뒤의 사람들</h1>
    <nav class="chapter-nav" aria-label="회차 이동"><a href="../">← 회차 목록</a><a rel="prev" href="../4화/index.html">← 이전 화</a></nav>
  </header>
  <div class="comic">
    <section id="p1"><img src="01.png" alt="비 내리는 기억시장. 병에 든 기억 앞에서 상인이 묻는다. ‘잊고 싶은 일이 있습니까?’ 하윤은 ‘기억하고 싶은 일이 있으면요?’라고 되묻고, 태오의 마른 농담에 작게 웃는다." width="793" height="1983" loading="eager"><a class="page-link" href="01.png">그림 크게 보기 · 1/4</a></section>
    <section id="p2"><img src="02.png" alt="둥근 안경의 상인이 도진의 시계를 알아보고 수리 값과 구두 못 영수증 묶음을 말한다. 일곱 명의 초상이 걸린 홍수기념관 앞에서 하윤의 수첩에는 지워지지 않은 물음표 스물두 개가 남아 있다." width="793" height="1983" loading="lazy"><a class="page-link" href="02.png">그림 크게 보기 · 2/4</a></section>
    <section id="p3"><img src="03.png" alt="모래가 아이를 미정빵집에 맡기고 도진도 그곳으로 보냈다고 말한다. 초상 일곱 장과 숨은 건판, 심지를 낮춘 등잔, 열쇠로 액자 뒷면 도료를 긁어 드러낸 29가 보인다. 하윤은 ‘일곱 명만 돌아온 게 아니었어요.’라고 말한다." width="793" height="1983" loading="lazy"><a class="page-link" href="03.png">그림 크게 보기 · 3/4</a></section>
    <section id="p4"><img src="04.png" alt="건판의 보라색 빛이 아이 얼굴을 맑게 바꾼다. 모래가 ‘놓아요.’라고 경고하지만, 사진 속 아이가 하윤을 보고 ‘언니, 내 이름 알지?’라고 묻는다." width="793" height="1983" loading="lazy"><a class="page-link" href="04.png">그림 크게 보기 · 4/4</a></section>
