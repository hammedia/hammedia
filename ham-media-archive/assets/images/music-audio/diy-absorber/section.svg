<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="단면: 방 쪽부터 천, 멜라민 블록 2센티미터, 공기층 약 5센티미터, 벽">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8A8F98" stroke-width="3"/>
    </pattern>
    <pattern id="foam" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#EEF0F3"/><circle cx="2" cy="2" r="1.1" fill="#B8BEC7"/><circle cx="6" cy="6" r="1.1" fill="#C9CED5"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#E8449A"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9AA1A9"/></marker>
  </defs>
  <rect width="640" height="300" fill="#FFFFFF"/>
  <!-- wall -->
  <rect x="566" y="20" width="60" height="230" fill="url(#hatch)"/>
  <rect x="566" y="20" width="60" height="230" fill="none" stroke="#6B7078" stroke-width="2"/>
  <!-- frame top & bottom (wood, 6.8cm = 340px) -->
  <rect x="226" y="40" width="340" height="26" fill="#C99B6D" stroke="#7A5C3E" stroke-width="2"/>
  <rect x="226" y="204" width="340" height="26" fill="#C99B6D" stroke="#7A5C3E" stroke-width="2"/>
  <!-- fabric -->
  <path d="M232 34 L222 34 L222 236 L232 236" fill="none" stroke="#1D3557" stroke-width="7" stroke-linejoin="round"/>
  <!-- melamine 2cm = 100px -->
  <rect x="226" y="66" width="100" height="138" fill="url(#foam)" stroke="#9AA1A9" stroke-width="2"/>
  <!-- air -->
  <rect x="326" y="66" width="240" height="138" fill="#F7F9FB"/>
  <text x="446" y="132" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="800" fill="#16181D">공기층</text>
  <text x="446" y="166" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="26" font-weight="700" fill="#555">약 5cm</text>
  <!-- sound -->
  <line x1="24" y1="104" x2="206" y2="104" stroke="#E8449A" stroke-width="6" marker-end="url(#ah)"/>
  <line x1="206" y1="164" x2="96" y2="164" stroke="#9AA1A9" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
  <text x="18" y="88" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#16181D">방의 소리</text>
  <text x="18" y="200" font-family="Pretendard, sans-serif" font-size="22" font-weight="800" fill="#6B7078">되튀는 소리↓</text>
  <!-- labels -->
  <g font-family="Pretendard, sans-serif" font-weight="800" fill="#16181D">
    <text x="214" y="26" text-anchor="end" font-size="22" fill="#1D3557">천 ▸</text>
    <text x="276" y="26" text-anchor="middle" font-size="22">멜라민 2cm</text>
    <text x="396" y="292" text-anchor="middle" font-size="22">틀 깊이 6.8cm</text>
    <text x="596" y="292" text-anchor="middle" font-size="22">벽</text>
  </g>
  <g stroke="#16181D" stroke-width="2">
    <line x1="226" y1="252" x2="566" y2="252"/><line x1="226" y1="244" x2="226" y2="260"/><line x1="566" y1="244" x2="566" y2="260"/>
  </g>
</svg>
