        --ivory: #F5F3EE;
        --ink: #1C1814;

      * { box-sizing: border-box; }

      }
      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.08em;

      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        line-height: 1.4;
        margin: 0;
        max-width: 640px;
      }
      p {
        max-width: 520px;
        line-height: 1.7;
        margin: 0;
        color: rgba(28, 24, 20, 0.78);
      }
      a.back {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 28px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--ivory);
